# Práctica 3 - GitHub Actions
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

env:
  IMAGE_NAME: "scalian_training-java-hello-world:0.0.2"
  APP_URL: "http://localhost:8084/hello"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    container: maven:3.8.6-openjdk-11-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "Java:   $(java -version 2>&1 | head -1)"
          echo "Maven:  $(mvn -version 2>&1 | head -1)"

      - name: Install make
        run: apt-get update && apt-get install -y make

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Variables y secrets
        run: |
          echo "IMAGE_NAME:      ${{ env.IMAGE_NAME }}"
          echo "REGISTRY_HOST:   ${{ vars.REGISTRY_HOST }}"
          echo "ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}"
          echo "RUN_CD:          ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV:      ${{ inputs.DEPLOY_ENV }}"
