# Práctica 3 - GitHub Actions
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

env:
  IMAGE_NAME: "scalian_training-java-hello-world:0.0.2"
  APP_URL: "http://localhost:8084/hello"

jobs:
  ci-test:
    name: CI - Tests
    runs-on: ubuntu-latest
    container: maven:3.8.6-openjdk-11-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "Java:   $(java -version 2>&1 | head -1)"
          echo "Maven:  $(mvn -version 2>&1 | head -1)"

      - name: Install make
        run: apt-get update && apt-get install -y make

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  ci-build:
    name: CI - Build Docker
    runs-on: ubuntu-latest
    needs: [ci-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          echo "Building image: ${{ env.IMAGE_NAME }}"
          docker build -t "${{ env.IMAGE_NAME }}" --build-arg VERSION=0.0.2 -f devops/Dockerfile .

      - name: Verify image
        run: docker images "${{ env.IMAGE_NAME }}"

  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: [ci-build]
    if: >
      (github.ref_name == 'develop' || github.ref_name == 'master')
      && inputs.RUN_CD == true
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (para compose)
        run: docker build -t "${{ env.IMAGE_NAME }}" --build-arg VERSION=0.0.2 -f devops/Dockerfile .

      - name: Deploy con Docker Compose
        run: |
          echo "Deploying to ${{ env.DEPLOY_ENV }}"
          docker compose up -d java_app
          sleep 10

      - name: Test E2E (curl)
        run: |
          echo "Testing ${{ env.APP_URL }}"
          curl -fsS "${{ env.APP_URL }}"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker compose down --volumes || true
          docker rmi "${{ env.IMAGE_NAME }}" || true
